pre-commit:
  parallel: true
  jobs:
    - name: format-and-lint
      glob: '*.{js,ts,jsx,tsx,json,jsonc,css,html}'
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true # lefthook automatically runs 'git commit on staged files'
      